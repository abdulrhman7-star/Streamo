<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Streamo - منصة الأفلام والمسلسلات</title>
  <style>
    :root {
      --bg-primary: #0b0f19;
      --bg-secondary: #111827;
      --bg-card: #1f2937;
      --accent-color: #3b82f6;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --border-color: #374151;
    }
    body {
      margin: 0; padding: 0;
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: system-ui, -apple-system, sans-serif;
    }
    header {
      background-color: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      padding: 20px; text-align: center;
    }
    header h1 { margin: 0; font-size: 24px; color: var(--accent-color); cursor: pointer; }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    .search-box { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; }
    .search-box input {
      width: 100%; max-width: 500px; padding: 12px 16px;
      background-color: var(--bg-secondary); border: 1px solid var(--border-color);
      border-radius: 8px; color: var(--text-main); font-size: 15px;
    }
    .search-box input:focus { outline: none; border-color: var(--accent-color); }
    .search-box button {
      padding: 0 20px; background-color: var(--accent-color); color: white;
      border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
    }
    .results-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px; margin-bottom: 40px;
    }
    .movie-card {
      background-color: var(--bg-card); border-radius: 10px; overflow: hidden;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3); cursor: pointer;
      transition: transform 0.2s; display: flex; flex-direction: column;
    }
    .movie-card:hover { transform: translateY(-5px); }
    .movie-card img { width: 100%; height: 280px; object-fit: cover; }
    .movie-info { padding: 12px; display: flex; flex-direction: column; gap: 6px; flex-grow: 1; }
    .movie-title { font-size: 14px; font-weight: bold; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .movie-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); }
    
    .moviesio-player-container {
      display: none; flex-direction: column; gap: 20px;
      width: 100%; max-width: 1100px; margin: 20px auto;
      background: var(--bg-secondary); padding: 20px; border-radius: 16px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    }
    @media (min-width: 868px) { .moviesio-player-container { flex-direction: row; } }
    .video-wrapper {
      position: relative; flex: 3; width: 100%; aspect-ratio: 16 / 9;
      background: #000; border-radius: 12px; overflow: hidden;
    }
    .video-wrapper video { width: 100%; height: 100%; object-fit: contain; }
    .player-overlay-controls {
      position: absolute; top: 15px; left: 15px; z-index: 10; display: flex; gap: 8px;
    }
    .player-overlay-controls select {
      background: rgba(0, 0, 0, 0.7); color: #fff; border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px;
    }
    .episodes-sidebar {
      flex: 1.2; background: var(--bg-card); border-radius: 12px; padding: 15px;
      display: flex; flex-direction: column; max-height: 500px;
    }
    .sidebar-header h3 { margin: 0 0 10px 0; font-size: 16px; }
    #episodeSearchInput {
      width: 100%; padding: 10px; background: var(--bg-primary);
      border: 1px solid var(--border-color); border-radius: 8px; color: #fff;
      font-size: 13px; margin-bottom: 12px; box-sizing: border-box;
    }
    .episodes-list { overflow-y: auto; display: flex; flex-direction: column; gap: 8px; flex-grow: 1; }
    .episode-item {
      display: flex; align-items: center; gap: 12px; padding: 10px 12px;
      background: #2d3748; border-radius: 8px; color: var(--text-muted);
      text-decoration: none; font-size: 13px; cursor: pointer;
    }
    .episode-item:hover, .episode-item.active { background: var(--accent-color); color: #fff; }
    .ep-num { font-weight: bold; }
  </style>
</head>
<body>
  <header><h1 onclick="loadHomeMovies()">Streamo Pro</h1></header>
  <div class="container">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="ابحث عن فيلم أو مسلسل (مثال: Batman)..." onkeypress="if(event.key === 'Enter') searchMedia()">
      <button onclick="searchMedia()">بحث</button>
    </div>

    <div class="moviesio-player-container" id="mediaViewerContainer">
      <div class="video-wrapper">
        <video id="mainVideoPlayer" controls preload="metadata">عذراً، متصفحك لا يدعم التشغيل.</video>
        <div class="player-overlay-controls">
          <select id="subtitleSelector" onchange="changeSubtitle(this.value)"><option value="off">إيقاف الترجمة</option></select>
          <select id="qualitySelector" onchange="changeQuality(this.value)"></select>
        </div>
      </div>
      <div class="episodes-sidebar" id="episodesSidebar" style="display: none;">
        <div class="sidebar-header">
          <h3>قائمة الحلقات</h3>
          <input type="text" id="episodeSearchInput" placeholder="ابحث برقم أو عنوان..." onkeyup="filterEpisodes()">
        </div>
        <div class="episodes-list" id="episodesListContainer"></div>
      </div>
    </div>

    <div class="results-grid" id="resultsGrid"></div>
  </div>

  <script>
    // تحميل أحدث الأفلام والمسلسلات تلقائياً عند فتح الصفحة
    async function loadHomeMovies() {
      document.getElementById('mediaViewerContainer').style.display = 'none';
      const grid = document.getElementById('resultsGrid');
      grid.innerHTML = '<p style="text-align:center; color:var(--text-muted); grid-column: 1/-1;">جاري تحميل أحدث الأفلام والمسلسلات...</p>';
      try {
        const res = await fetch('/api/home');
        const result = await res.json();
        grid.innerHTML = '';
        if (result.success && result.data && result.data.length > 0) {
          result.data.forEach(item => {
            const card = document.createElement('div');
            card.className = 'movie-card';
            const isSeries = item.title.includes('مسلسل');
            card.innerHTML = `<img src="${item.image}" alt="${item.title}" onerror="this.src='https://via.placeholder.com/200x280?text=No+Image'"><div class="movie-info"><p class="movie-title">${item.title}</p><div class="movie-meta"><span>${item.year || ''}</span><span>⭐ ${item.rating || '0.0'}</span></div></div>`;
            card.onclick = () => loadMedia(item.url, isSeries);
            grid.appendChild(card);
          });
        } else {
          grid.innerHTML = '<p style="text-align:center; color:var(--text-muted); grid-column: 1/-1;">لا توجد عناصر مضافة حالياً.</p>';
        }
      } catch (e) {
        grid.innerHTML = '<p style="text-align:center; color:red; grid-column: 1/-1;">حدث خطأ أثناء الاتصال بالخادم.</p>';
      }
    }

    async function searchMedia() {
      const query = document.getElementById('searchInput').value.trim();
      if (!query) return;
      const grid = document.getElementById('resultsGrid');
      grid.innerHTML = '<p style="text-align:center; color:var(--text-muted); grid-column: 1/-1;">جاري البحث...</p>';
      try {
        const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
        const result = await res.json();
        grid.innerHTML = '';
        if (result.success && result.data && result.data.length > 0) {
          result.data.forEach(item => {
            const card = document.createElement('div');
            card.className = 'movie-card';
            const isSeries = item.title.includes('مسلسل');
            card.innerHTML = `<img src="${item.image}" alt="${item.title}" onerror="this.src='https://via.placeholder.com/200x280?text=No+Image'"><div class="movie-info"><p class="movie-title">${item.title}</p><div class="movie-meta"><span>${item.year || ''}</span><span>⭐ ${item.rating || '0.0'}</span></div></div>`;
            card.onclick = () => loadMedia(item.url, isSeries);
            grid.appendChild(card);
          });
        } else {
          grid.innerHTML = '<p style="text-align:center; color:var(--text-muted); grid-column: 1/-1;">لم يتم العثور على نتائج.</p>';
        }
      } catch (e) {
        grid.innerHTML = '<p style="text-align:center; color:red; grid-column: 1/-1;">حدث خطأ أثناء جلب البيانات.</p>';
      }
    }

    async function loadMedia(itemUrl, isSeries) {
      document.getElementById('mediaViewerContainer').style.display = 'flex';
      window.scrollTo({ top: 0, behavior: 'smooth' });
      if (isSeries) {
        document.getElementById('episodesSidebar').style.display = 'flex';
        await fetchTvEpisodes(itemUrl);
      } else {
        document.getElementById('episodesSidebar').style.display = 'none';
        await fetchMediaDetails(itemUrl);
      }
    }

    async function fetchMediaDetails(url) {
      try {
        const res = await fetch(`/api/details?url=${encodeURIComponent(url)}`);
        const result = await res.json();
        if (result.success && result.data) setupVideoPlayer(result.data);
      } catch (e) { console.error(e); }
    }

    async function fetchTvEpisodes(url) {
      try {
        const res = await fetch(`/api/tv?url=${encodeURIComponent(url)}`);
        const result = await res.json();
        if (result.success && result.episodes) {
          const list = document.getElementById('episodesListContainer');
          list.innerHTML = '';
          result.episodes.forEach((ep, idx) => {
            const item = document.createElement('a');
            item.className = `episode-item ${idx === 0 ? 'active' : ''}`;
            item.setAttribute('data-title', ep.title);
            item.innerHTML = `<span class="ep-num">${idx + 1}</span><span class="ep-title">${ep.title}</span>`;
            item.onclick = (e) => {
              e.preventDefault();
              document.querySelectorAll('.episode-item').forEach(el => el.classList.remove('active'));
              item.classList.add('active');
              fetchMediaDetails(ep.url);
            };
            list.appendChild(item);
          });
          if (result.episodes.length > 0) fetchMediaDetails(result.episodes[0].url);
        }
      } catch (e) { console.error(e); }
    }

    function setupVideoPlayer(data) {
      const video = document.getElementById('mainVideoPlayer');
      video.innerHTML = '';
      if (data.links && data.links.length > 0) {
        const source = document.createElement('source');
        source.src = data.links[0].url;
        source.type = data.links[0].isM3u8 ? 'application/x-mpegURL' : 'video/mp4';
        video.appendChild(source);
        const qSelect = document.getElementById('qualitySelector');
        qSelect.innerHTML = '';
        data.links.forEach((l, i) => {
          const opt = document.createElement('option');
          opt.value = l.url; opt.textContent = l.quality;
          if (i === 0) opt.selected = true;
          qSelect.appendChild(opt);
        });
      }
      video.load();
      video.play().catch(() => {});
    }

    function changeQuality(url) {
      const video = document.getElementById('mainVideoPlayer');
      const time = video.currentTime; const paused = video.paused;
      const source = video.querySelector('source') || document.createElement('source');
      source.src = url;
      source.type = url.includes('.m3u8') ? 'application/x-mpegURL' : 'video/mp4';
      if (!video.contains(source)) video.appendChild(source);
      video.load(); video.currentTime = time;
      if (!paused) video.play();
    }

    function filterEpisodes() {
      const input = document.getElementById('episodeSearchInput').value.toLowerCase();
      const items = document.getElementById('episodesListContainer').getElementsByClassName('episode-item');
      for (let i = 0; i < items.length; i++) {
        const title = items[i].getAttribute('data-title').toLowerCase();
        items[i].style.display = title.includes(input) ? 'flex' : 'none';
      }
    }

    // تشغيل دالة جلب الصفحة الرئيسية تلقائياً عند فتح الموقع
    window.onload = () => {
      loadHomeMovies();
    };
  </script>
</body>
</html>
