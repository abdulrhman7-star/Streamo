<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoviesIO Pro - بث فائق السرعة</title>
    
    <!-- Video.js CSS -->
    <link href="https://vjs.zencdn.net/8.6.1/video-js.css" rel="stylesheet" />
    <!-- خطوط عربية -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #e50914;
            --bg-dark: #141414;
            --bg-card: #1f1f1f;
            --text-light: #ffffff;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--bg-dark); color: var(--text-light); }
        
        /* شريط البحث */
        .search-container {
            padding: 20px;
            background: rgba(0,0,0,0.8);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .search-input {
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #333;
            color: white;
            width: 100%;
            max-width: 500px;
            font-family: inherit;
        }
        .search-btn {
            padding: 12px 24px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        /* شبكة النتائج */
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .movie-card {
            background: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
        }
        .movie-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(229, 9, 20, 0.2); }
        .movie-poster {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
            background: #333;
        }
        .movie-info { padding: 12px; }
        .movie-title { font-size: 0.95rem; font-weight: 700; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .movie-meta { font-size: 0.8rem; color: #aaa; display: flex; justify-content: space-between; }
        .quality-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: var(--primary);
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        /* مشغل الفيديو ومنطقة التفاصيل */
        .player-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            overflow-y: auto;
            padding: 20px;
        }
        .player-modal.active { display: block; }
        .close-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            font-size: 1.5rem;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 1001;
        }
        
        /* حاوية المشغل المتجاوبة 16:9 */
        .video-container {
            position: relative;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto 20px;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        /* Facade Pattern: الواجهة المؤقتة */
        .video-facade {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
        }
        .video-facade::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.4);
        }
        .play-icon {
            width: 80px;
            height: 80px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 11;
            box-shadow: 0 0 20px rgba(229, 9, 20, 0.6);
            transition: transform 0.2s;
        }
        .play-icon::before {
            content: '▶';
            color: white;
            font-size: 2rem;
            margin-right: -4px;
        }
        .video-facade:hover .play-icon { transform: scale(1.1); }

        .movie-details {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        .server-list {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }
        .server-btn {
            padding: 8px 16px;
            background: #333;
            border: 1px solid #444;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .server-btn.active, .server-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
        }

        /* Video.js Customization */
        .video-js .vjs-big-play-button { display: none; } /* إخفاء زر التشغيل الافتراضي لأننا نستخدم Facade */
    </style>
</head>
<body>

    <div class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="ابحث عن فيلم أو مسلسل (مثال: Interstellar)...">
        <button class="search-btn" onclick="performSearch()">بحث</button>
    </div>

    <div id="resultsGrid" class="results-grid">
        <!-- سيتم ملء النتائج هنا ديناميكياً -->
        <div style="grid-column: 1/-1; text-align: center; color: #666; padding: 50px;">
            ابدأ البحث لاكتشاف الأفلام والمسلسلات
        </div>
    </div>

    <!-- نافذة المشغل المنبثقة -->
    <div id="playerModal" class="player-modal">
        <button class="close-btn" onclick="closePlayer()">✕</button>
        
        <div class="video-container">
            <!-- الواجهة المؤقتة (Facade) -->
            <div id="videoFacade" class="video-facade" onclick="loadAndPlayVideo()">
                <div class="play-icon"></div>
            </div>
            <!-- مشغل الفيديو الفعلي -->
            <video id="mainPlayer" class="video-js vjs-default-skin vjs-big-play-centered" controls preload="none" style="width: 100%; height: 100%; display: none;">
                <p class="vjs-no-js">يجب تفعيل JavaScript لمشاهدة الفيديو.</p>
            </video>
        </div>

        <div class="movie-details">
            <h2 id="modalTitle">عنوان الفيلم</h2>
            <p id="modalStory" style="color: #ccc; margin-top: 10px; line-height: 1.6;"></p>
            <div style="margin-top: 15px; display: flex; gap: 15px; color: #aaa; font-size: 0.9rem;">
                <span id="modalRating">⭐ 0.0</span>
                <span id="modalDuration">⏱ 0 دقيقة</span>
            </div>
            
            <h3 style="margin-top: 25px; font-size: 1.1rem;">سيرفرات المشاهدة:</h3>
            <div id="serverList" class="server-list">
                <!-- أزرار السيرفرات -->
            </div>
        </div>
    </div>

    <!-- Video.js & HLS.js -->
    <script src="https://vjs.zencdn.net/8.6.1/video.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/videojs-contrib-hls@5.15.0/dist/videojs-contrib-hls.min.js"></script>

    <script>
        // استبدل هذا برابط سيرفر Node.js الخاص بك (أو استخدم Proxy محلي للتطوير)
        const API_BASE = 'http://localhost:3000/api'; 
        
        let currentPlayer = null;
        let currentVideoUrl = '';
        let currentFacadeImage = '';

        // 1. وظيفة البحث
        async function performSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            const grid = document.getElementById('resultsGrid');
            grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center;">جاري البحث...</div>';

            try {
                const response = await fetch(`${API_BASE}/search?q=${encodeURIComponent(query)}`);
                const data = await response.json();

                if (data.success && data.data.length > 0) {
                    grid.innerHTML = data.data.map(movie => `
                        <div class="movie-card" onclick="openMovie('${movie.url}', '${movie.title.replace(/'/g, "\\'")}', '${movie.image}')">
                            <span class="quality-badge">${movie.quality || 'HD'}</span>
                            <img src="${movie.image || 'https://via.placeholder.com/300x450?text=No+Image'}" class="movie-poster" loading="lazy" alt="${movie.title}">
                            <div class="movie-info">
                                <div class="movie-title">${movie.title}</div>
                                <div class="movie-meta">
                                    <span>${movie.rating || 'N/A'}</span>
                                </div>
                            </div>
                        </div>
                    `).join('');
                } else {
                    grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center;">لا توجد نتائج مطابقة.</div>';
                }
            } catch (error) {
                console.error(error);
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: red;">حدث خطأ في الاتصال بالسيرفر.</div>';
            }
        }

        // 2. فتح تفاصيل الفيلم وجلب الروابط
        async function openMovie(url, title, image) {
            document.getElementById('playerModal').classList.add('active');
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('videoFacade').style.backgroundImage = `url(${image})`;
            currentFacadeImage = image;
            
            // إعادة تعيين المشغل
            resetPlayer();

            try {
                const response = await fetch(`${API_BASE}/details?url=${encodeURIComponent(url)}`);
                const data = await response.json();

                if (data.success) {
                    const movie = data.data;
                    document.getElementById('modalStory').innerText = movie.story || 'لا يوجد وصف متاح.';
                    document.getElementById('modalRating').innerText = `⭐ ${movie.rating || 'غير متوفر'}`;
                    document.getElementById('modalDuration').innerText = `⏱ ${movie.duration || 'غير متوفر'}`;

                    // بناء أزرار السيرفرات
                    const serverList = document.getElementById('serverList');
                    serverList.innerHTML = '';
                    
                    if (movie.links && movie.links.length > 0) {
                        movie.links.forEach((link, index) => {
                            const btn = document.createElement('button');
                            btn.className = `server-btn ${index === 0 ? 'active' : ''}`;
                            btn.innerText = `${link.quality} ${link.isM3u8 ? '(بث مباشر)' : '(MP4)'}`;
                            btn.onclick = () => {
                                document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
                                btn.classList.add('active');
                                currentVideoUrl = link.url;
                                // إذا كان المشغل مفتوحاً بالفعل، قم بتحديث المصدر
                                if (document.getElementById('mainPlayer').style.display === 'block') {
                                    loadAndPlayVideo();
                                }
                            };
                            serverList.appendChild(btn);
                        });
                        
                        // تعيين الرابط الأول افتراضياً
                        currentVideoUrl = movie.links[0].url;
                    } else {
                        serverList.innerHTML = '<p style="color: #e50914;">لم يتم العثور على روابط مشاهدة مباشرة لهذا العمل.</p>';
                    }
                }
            } catch (error) {
                console.error(error);
                document.getElementById('modalStory').innerText = 'فشل في جلب بيانات الفيلم.';
            }
        }

        // 3. نمط الواجهة المؤقتة (Facade Pattern) لتسريع التحميل الأولي
        function loadAndPlayVideo() {
            if (!currentVideoUrl) return;

            const facade = document.getElementById('videoFacade');
            const playerEl = document.getElementById('mainPlayer');
            
            // إخفاء الواجهة المؤقتة وإظهار المشغل
            facade.style.display = 'none';
            playerEl.style.display = 'block';

            if (!currentPlayer) {
                currentPlayer = videojs('mainPlayer', {
                    html5: {
                        hls: { overrideNative: true }
                    },
                    responsive: true,
                    fluid: true
                });
            }

            // تحديد نوع الفيديو (HLS أو MP4)
            const type = currentVideoUrl.includes('.m3u8') ? 'application/x-mpegURL' : 'video/mp4';
            
            currentPlayer.src({ type: type, src: currentVideoUrl });
            currentPlayer.play().catch(e => console.log('Auto-play prevented by browser:', e));
        }

        function resetPlayer() {
            if (currentPlayer) {
                currentPlayer.pause();
                currentPlayer.src('');
            }
            document.getElementById('mainPlayer').style.display = 'none';
            document.getElementById('videoFacade').style.display = 'flex';
        }

        function closePlayer() {
            document.getElementById('playerModal').classList.remove('active');
            resetPlayer();
        }

        // دعم مفتاح Enter للبحث
        document.getElementById('searchInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') performSearch();
        });
    </script>
</body>
</html>
