<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Akwam Cinema - منصة أكوام السينمائية</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts (Cairo for modern Arabic typography) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            cairo: ['Cairo', 'sans-serif'],
          },
          colors: {
            akwam: {
              red: '#e50914',
              redHover: '#b80710',
              gold: '#ffb703',
              dark: '#0f172a',
              card: '#1e293b',
              accent: '#38bdf8'
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background-color: #0b0f19;
      color: #f8fafc;
    }
    
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0b0f19;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #e50914;
    }

    /* Glassmorphism Effect */
    .glass {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    
    /* Subtle Glowing text & cards */
    .glow-red {
      box-shadow: 0 0 20px rgba(229, 9, 20, 0.35);
    }
  </style>

  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#0b0f19] text-gray-100 min-h-screen flex flex-col">

  <div id="root"></div>

  <!-- React Application Logic -->
  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // --- MOCK AKWAM PROVIDER DATA & BACKEND SERVICE SIMULATION ---

    const AKWAM_CATALOG = [

        cast: ["محمد هنيدي", "أحمد السقا", "موناليزا", "أحمد عيد"],

        ],

          { quality: "720p", size: "1.1 GB", url: "https://s301d1.downet.net/download/1788722441/6a9c6b899a86f/Hammam.Fi.Amsterdam.1999.720P.WEB-DL.AKWAM.mp4" },
          { quality: "480p", size: "513 MB", url: "https://s301d1.downet.net/download/1788722441/6a9c6b895c09e/Hammam.Fi.Amsterdam.1999.480P.WEB-DL.AKWAM.mp4" }
        ]
      },
      {
        id: "ak-102",
        title: "صعيد في الجامعة الأمريكية",
        originalTitle: "Sa'eedi Fi Al-Gamaa Al-Amrekiya",
        type: "movie",
        year: 1998,
        rating: 8.1,
        category: "كوميدي / شبابي",
        duration: "110 دقيقة",
        country: "مصر",
        poster: "https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=800&q=80",
        banner: "https://images.unsplash.com/photo-1518676599626-fcd67d79671f?auto=format&fit=crop&w=1600&q=80",
        story: "خلف الدهشوري طالب قادم من الصعيد يحصل على المنحة الدراسية بالجامعة الأمريكية بالقاهرة، ويعيش عالمًا جديدًا كليًا عليه وينشأ بينه وبين زملائه الكثير من المفارقات الكوميدية.",
        cast: ["محمد هنيدي", "أحمد السقا", "منى زكي", "طارق لطفى"],
        downloadLinks: [
          { quality: "1080p", size: "2.1 GB", url: "https://akwam.ss/download/119210/Saedi" },
          { quality: "720p", size: "1.0 GB", url: "https://akwam.ss/download/119211/Saedi" }
        ],
        streamLinks: [
          { quality: "1080p", size: "2.1 GB", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" },
          { quality: "720p", size: "1.0 GB", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" }
        ]
      },
      {
        id: "ak-103",
        title: "مسلسل الاختيار - الموسم الأول",
        originalTitle: "Al Ekhteyar S1",
        type: "series",
        year: 2020,
        rating: 8.9,
        category: "حرب / أكشن / دراما",
        duration: "30 حلقة",
        country: "مصر",
        poster: "https://images.unsplash.com/photo-1579783902614-a3fb3927b675?auto=format&fit=crop&w=800&q=80",
        banner: "https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?auto=format&fit=crop&w=1600&q=80",
        story: "يتناول المسلسل حياة قائد الكتيبة 103 صاعقة في الجيش المصري العقيد أركان حرب أحمد صابر المنسي الذي استشهد في كمين مربع البرث بمدينة رفح المصرية عام 2017.",
        cast: ["أمير كرارة", "أحمد العوضي", "دينات فؤاد"],
        downloadLinks: [
          { quality: "720p", size: "450 MB / الحلقة", url: "https://akwam.ss/download/series/ekhteyar" }
        ],
        streamLinks: [
          { quality: "1080p", size: "850 MB", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4" },
          { quality: "720p", size: "450 MB", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4" }
        ]
      },
      {
        id: "ak-104",
        title: "الفيل الأزرق 2",
        originalTitle: "The Blue Elephant 2",
        type: "movie",
        year: 2019,
        rating: 8.0,
        category: "غموض / إثارة / رعب",
        duration: "130 دقيقة",
        country: "مصر",
        poster: "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&w=800&q=80",
        banner: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1600&q=80",
        story: "تبدأ أحداث الجزء الثاني بعد 5 سنوات من نهاية الجزء الأول، حيث يتزوج الدكتور (يحيى) من (لبنى)، ويتم استدعاؤه لقسم الحالات الخطرة (8 غرب حريم)، وتستمر المفاجآت.",
        cast: ["كريم عبد العزيز", "هند صبري", "نيللي كريم", "إياد نصار"],
        downloadLinks: [
          { quality: "1080p", size: "2.8 GB", url: "https://akwam.ss/download/elephant2" }
        ],
        streamLinks: [
          { quality: "1080p", size: "2.8 GB", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4" },
          { quality: "720p", size: "1.4 GB", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4" }
        ]
      },
      {
        id: "ak-105",
        title: "ما وراء الطبيعة - الموسم الأول",
        originalTitle: "Paranormal S1",
        type: "series",
        year: 2020,
        rating: 8.2,
        category: "غموض / رعب / خيال",
        duration: "6 حلقات",
        country: "مصر",
        poster: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=800&q=80",
        banner: "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&w=1600&q=80",
        story: "في ستينات القرن الماضي، يتحول طبيب أمراض الدم د. رفعت إسماعيل إلى خبير في التحقيق بالأحداث الخارقة للطبيعة بعد أن يواجه أحداثًا غريبة لا يجد لها تفسيرًا علميًا.",
        cast: ["أحمد أمين", "رزان جمال", "آية سماحة"],
        downloadLinks: [
          { quality: "1080p", size: "1.2 GB / الحلقة", url: "https://akwam.ss/download/paranormal" }
        ],
        streamLinks: [
          { quality: "1080p", size: "1.2 GB", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4" },
          { quality: "720p", size: "600 MB", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4" }
        ]
      }
    ];

    // Simulated Provider API Service
    const AkwamProviderAPI = {
      searchContent: async (query, type = 'all') => {
        await new Promise(r => setTimeout(r, 200)); // simulate latency
        return AKWAM_CATALOG.filter(item => {
          const matchQuery = item.title.includes(query) || item.originalTitle.toLowerCase().includes(query.toLowerCase()) || item.category.includes(query);
          const matchType = type === 'all' ? true : item.type === type;
          return matchQuery && matchType;
        });
      },
      getTrending: async () => {
        await new Promise(r => setTimeout(r, 150));
        return AKWAM_CATALOG;
      },
      getById: async (id) => {
        return AKWAM_CATALOG.find(i => i.id === id);
      }
    };

    // --- MAIN APP COMPONENT ---
    function App() {
      const [items, setItems] = useState([]);
      const [loading, setLoading] = useState(true);
      const [searchQuery, setSearchQuery] = useState('');
      const [activeType, setActiveType] = useState('all'); // all, movie, series
      const [selectedItem, setSelectedItem] = useState(null); // Item details modal
      const [activePlayerItem, setActivePlayerItem] = useState(null); // Item to play
      const [activeQuality, setActiveQuality] = useState('720p');
      const [watchlist, setWatchlist] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem('akwam_watchlist') || '[]');
        } catch { return []; }
      });
      const [viewWatchlistOnly, setViewWatchlistOnly] = useState(false);

      // Save watchlist to localStorage
      useEffect(() => {
        localStorage.setItem('akwam_watchlist', JSON.stringify(watchlist));
      }, [watchlist]);

      // Fetch initial content
      useEffect(() => {
        loadCatalog();
      }, [activeType]);

      const loadCatalog = async () => {
        setLoading(true);
        const data = await AkwamProviderAPI.searchContent(searchQuery, activeType);
        setItems(data);
        setLoading(false);
      };

      const handleSearch = async (e) => {
        e.preventDefault();
        setLoading(true);
        const data = await AkwamProviderAPI.searchContent(searchQuery, activeType);
        setItems(data);
        setLoading(false);
      };

      const toggleWatchlist = (item) => {
        if (watchlist.some(w => w.id === item.id)) {
          setWatchlist(watchlist.filter(w => w.id !== item.id));
        } else {
          setWatchlist([...watchlist, item]);
        }
      };

      const displayedItems = useMemo(() => {
        if (viewWatchlistOnly) return watchlist;
        return items;
      }, [items, watchlist, viewWatchlistOnly]);

      const featuredHero = AKWAM_CATALOG[0];

      return (
        <div className="min-h-screen flex flex-col justify-between">
          {/* HEADER / NAVIGATION */}
          <header className="sticky top-0 z-40 glass border-b border-slate-800/80">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
              {/* Brand Logo */}
              <div className="flex items-center gap-8">
                <a href="#" onClick={() => { setViewWatchlistOnly(false); setSearchQuery(''); }} className="flex items-center gap-2 group">
                  <div className="w-10 h-10 bg-akwam-red rounded-xl flex items-center justify-center font-black text-2xl tracking-wider text-white shadow-lg shadow-akwam-red/30 group-hover:scale-105 transition-transform">
                    أ
                  </div>
                  <span className="text-2xl font-black tracking-wide bg-gradient-to-l from-white via-slate-200 to-red-500 bg-clip-text text-transparent">
                    أكـوام <span className="text-akwam-red text-xs px-2 py-0.5 rounded bg-akwam-red/10 border border-akwam-red/20 font-bold ml-1">Stream</span>
                  </span>
                </a>

                {/* Filter Pills */}
                <nav className="hidden md:flex items-center gap-2 bg-slate-900/60 p-1.5 rounded-xl border border-slate-800">
                  <button 
                    onClick={() => { setActiveType('all'); setViewWatchlistOnly(false); }}
                    className={`px-4 py-1.5 rounded-lg text-sm font-semibold transition-all ${activeType === 'all' && !viewWatchlistOnly ? 'bg-akwam-red text-white shadow' : 'text-slate-400 hover:text-white'}`}
                  >
                    الكل
                  </button>
                  <button 
                    onClick={() => { setActiveType('movie'); setViewWatchlistOnly(false); }}
                    className={`px-4 py-1.5 rounded-lg text-sm font-semibold transition-all ${activeType === 'movie' && !viewWatchlistOnly ? 'bg-akwam-red text-white shadow' : 'text-slate-400 hover:text-white'}`}
                  >
                    الأفلام
                  </button>
                  <button 
                    onClick={() => { setActiveType('series'); setViewWatchlistOnly(false); }}
                    className={`px-4 py-1.5 rounded-lg text-sm font-semibold transition-all ${activeType === 'series' && !viewWatchlistOnly ? 'bg-akwam-red text-white shadow' : 'text-slate-400 hover:text-white'}`}
                  >
                    المسلسلات
                  </button>
                </nav>
              </div>

              {/* Search Bar & Actions */}
              <div className="flex items-center gap-3">
                <form onSubmit={handleSearch} className="relative flex-1 sm:w-72">
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    placeholder="ابحث عن فيلم أو مسلسل..."
                    className="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-2 pr-10 text-sm text-slate-100 placeholder-slate-400 focus:outline-none focus:border-akwam-red focus:ring-1 focus:ring-akwam-red transition-all"
                  />
                  <button type="submit" className="absolute right-3 top-2.5 text-slate-400 hover:text-akwam-red transition-colors">
                    <i className="fa-solid fa-magnifying-glass"></i>
                  </button>
                </form>

                <button 
                  onClick={() => setViewWatchlistOnly(!viewWatchlistOnly)}
                  className={`p-2.5 rounded-xl border flex items-center gap-2 transition-all ${viewWatchlistOnly ? 'bg-akwam-red/20 border-akwam-red text-akwam-red' : 'bg-slate-900/80 border-slate-700 text-slate-300 hover:border-slate-500'}`}
                  title="قائمة المفضلة"
                >
                  <i className={`fa-${watchlist.length > 0 ? 'solid' : 'regular'} fa-bookmark text-akwam-gold`}></i>
                  <span className="hidden sm:inline text-xs font-bold">{watchlist.length}</span>
                </button>
              </div>
            </div>
          </header>

          {/* MAIN CONTENT AREA */}
          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full flex-1">
            
            {/* HERO BANNER SECTION (when not searching or viewing favorites) */}
            {!searchQuery && !viewWatchlistOnly && featuredHero && (
              <div className="relative rounded-3xl overflow-hidden mb-12 border border-slate-800 shadow-2xl group">
                <div className="absolute inset-0 bg-gradient-to-t from-[#0b0f19] via-[#0b0f19]/60 to-transparent z-10"></div>
                <div className="absolute inset-0 bg-gradient-to-r from-[#0b0f19] via-transparent to-transparent z-10"></div>
                <img 
                  src={featuredHero.banner} 
                  alt={featuredHero.title} 
                  className="w-full h-[400px] sm:h-[480px] object-cover object-center group-hover:scale-105 transition-transform duration-700"
                />
                
                <div className="absolute bottom-0 right-0 left-0 p-6 sm:p-10 z-20 max-w-2xl">
                  <div className="flex items-center gap-3 mb-3">
                    <span className="bg-akwam-red text-white text-xs px-3 py-1 rounded-full font-bold uppercase tracking-wider">
                      أعلى مشاهدة على أكوام
                    </span>
                    <span className="bg-slate-800/80 text-akwam-gold text-xs px-2.5 py-1 rounded-full border border-akwam-gold/30 font-bold flex items-center gap-1">
                      <i className="fa-solid fa-star text-[10px]"></i> {featuredHero.rating}
                    </span>
                    <span className="text-slate-400 text-xs font-semibold">{featuredHero.year}</span>
                  </div>

                  <h1 className="text-3xl sm:text-5xl font-black text-white mb-3 leading-tight">
                    {featuredHero.title}
                  </h1>

                  <p className="text-slate-300 text-sm line-clamp-2 sm:line-clamp-3 mb-6 font-normal leading-relaxed">
                    {featuredHero.story}
                  </p>

                  <div className="flex flex-wrap items-center gap-4">
                    <button 
                      onClick={() => {
                        setActivePlayerItem(featuredHero);
                        setActiveQuality(featuredHero.streamLinks[0]?.quality || '720p');
                      }}
                      className="bg-akwam-red hover:bg-akwam-redHover text-white px-6 py-3 rounded-xl font-bold flex items-center gap-2 shadow-lg shadow-akwam-red/30 hover:scale-105 transition-all"
                    >
                      <i className="fa-solid fa-play text-sm"></i> شاهد الآن مجاناً
                    </button>

                    <button 
                      onClick={() => setSelectedItem(featuredHero)}
                      className="bg-slate-800/90 hover:bg-slate-700 text-white border border-slate-600 px-5 py-3 rounded-xl font-semibold flex items-center gap-2 transition-all"
                    >
                      <i className="fa-solid fa-circle-info"></i> التفاصيل والتحميل
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* CATALOG TITLE */}
            <div className="flex items-center justify-between mb-6">
              <h2 className="text-2xl font-bold text-white flex items-center gap-3">
                <span className="w-2 h-7 bg-akwam-red rounded-full"></span>
                {viewWatchlistOnly ? 'قائمة المفضلة والمشاهدة لاحقاً' : searchQuery ? `نتائج البحث عن: "${searchQuery}"` : 'أحدث العروض على AkwamProvider'}
              </h2>
              <span className="text-slate-400 text-sm">
                عدد العناصر: ({displayedItems.length})
              </span>
            </div>

            {/* LOADING STATE */}
            {loading ? (
              <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6">
                {[1, 2, 3, 4, 5].map((n) => (
                  <div key={n} className="bg-slate-800/50 rounded-2xl h-80 animate-pulse border border-slate-800"></div>
                ))}
              </div>
            ) : displayedItems.length === 0 ? (
              /* EMPTY STATE */
              <div className="text-center py-20 bg-slate-900/40 rounded-3xl border border-slate-800">
                <i className="fa-solid fa-film text-5xl text-slate-600 mb-4"></i>
                <h3 className="text-xl font-bold text-slate-300 mb-2">لم يتم العثور على أي نتائج</h3>
                <p className="text-slate-500 text-sm max-w-md mx-auto">
                  تأكد من كتابة اسم الفيلم بشكل صحيح أو ابحث بكلمات أخرى.
                </p>
              </div>
            ) : (
              /* CARDS GRID */
              <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6">
                {displayedItems.map((item) => {
                  const isBookmarked = watchlist.some(w => w.id === item.id);
                  return (
                    <div 
                      key={item.id} 
                      className="group bg-slate-900 rounded-2xl overflow-hidden border border-slate-800 hover:border-slate-600 transition-all duration-300 flex flex-col justify-between shadow-lg relative"
                    >
                      {/* Card Image Container */}
                      <div className="relative aspect-[2/3] overflow-hidden bg-slate-950">
                        <img 
                          src={item.poster} 
                          alt={item.title} 
                          className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
                        />
                        <div className="absolute inset-0 bg-gradient-to-t from-slate-950 via-transparent to-black/30 opacity-80"></div>
                        
                        {/* Rating Tag */}
                        <div className="absolute top-3 left-3 bg-slate-950/80 backdrop-blur-md px-2.5 py-1 rounded-lg border border-white/10 text-akwam-gold text-xs font-bold flex items-center gap-1 shadow">
                          <i className="fa-solid fa-star text-[10px]"></i> {item.rating}
                        </div>

                        {/* Bookmark Button */}
                        <button 
                          onClick={(e) => { e.stopPropagation(); toggleWatchlist(item); }}
                          className={`absolute top-3 right-3 w-8 h-8 rounded-lg flex items-center justify-center backdrop-blur-md border transition-all ${isBookmarked ? 'bg-akwam-red text-white border-akwam-red' : 'bg-slate-950/60 text-slate-300 border-white/10 hover:bg-slate-800'}`}
                        >
                          <i className={`fa-${isBookmarked ? 'solid' : 'regular'} fa-bookmark text-xs`}></i>
                        </button>

                        {/* Overlay Play Button */}
                        <div className="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity bg-black/40 backdrop-blur-[2px]">
                          <button 
                            onClick={() => {
                              setActivePlayerItem(item);
                              setActiveQuality(item.streamLinks[0]?.quality || '720p');
                            }}
                            className="w-12 h-12 bg-akwam-red text-white rounded-full flex items-center justify-center shadow-xl hover:scale-110 transition-transform"
                          >
                            <i className="fa-solid fa-play text-lg translate-x-[-1px]"></i>
                          </button>
                        </div>

                        {/* Quality Badge */}
                        <div className="absolute bottom-3 right-3 bg-slate-800/90 text-white text-[10px] font-bold px-2 py-0.5 rounded border border-slate-700">
                          WEB-DL 1080p
                        </div>
                      </div>

                      {/* Card Content */}
                      <div className="p-4 flex-1 flex flex-col justify-between">
                        <div>
                          <div className="flex items-center justify-between text-xs text-slate-400 mb-1">
                            <span>{item.type === 'movie' ? 'فيلم' : 'مسلسل'}</span>
                            <span>{item.year}</span>
                          </div>
                          <h3 className="font-bold text-white text-base leading-snug line-clamp-1 group-hover:text-akwam-red transition-colors">
                            {item.title}
                          </h3>
                          <p className="text-xs text-slate-400 mt-1 line-clamp-1">{item.category}</p>
                        </div>

                        <div className="mt-4 pt-3 border-t border-slate-800/80 flex items-center justify-between text-xs">
                          <button 
                            onClick={() => setSelectedItem(item)}
                            className="text-slate-300 hover:text-akwam-red font-semibold transition-colors flex items-center gap-1"
                          >
                            التفاصيل والروابط <i className="fa-solid fa-chevron-left text-[10px]"></i>
                          </button>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </main>

          {/* ITEM DETAILS MODAL */}
          {selectedItem && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md overflow-y-auto">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-3xl w-full overflow-hidden shadow-2xl relative my-8 animate-fadeIn">
                {/* Close Modal */}
                <button 
                  onClick={() => setSelectedItem(null)}
                  className="absolute top-4 left-4 z-20 w-10 h-10 bg-slate-800/80 hover:bg-slate-700 text-white rounded-full flex items-center justify-center transition-colors border border-slate-700"
                >
                  <i className="fa-solid fa-xmark"></i>
                </button>

                {/* Banner & Header */}
                <div className="relative h-64 sm:h-80">
                  <img src={selectedItem.banner} alt={selectedItem.title} className="w-full h-full object-cover" />
                  <div className="absolute inset-0 bg-gradient-to-t from-slate-900 via-slate-900/50 to-transparent"></div>
                  
                  <div className="absolute bottom-6 right-6 left-6 flex items-end gap-6">
                    <img 
                      src={selectedItem.poster} 
                      alt={selectedItem.title} 
                      className="w-28 sm:w-36 rounded-2xl shadow-2xl border-2 border-slate-700 hidden sm:block aspect-[2/3] object-cover" 
                    />
                    <div>
                      <div className="flex items-center gap-2 mb-2">
                        <span className="bg-akwam-red text-white text-xs font-bold px-2.5 py-0.5 rounded">
                          {selectedItem.type === 'movie' ? 'فيلم' : 'مسلسل'}
                        </span>
                        <span className="text-akwam-gold font-bold text-xs bg-slate-800/80 px-2 py-0.5 rounded border border-akwam-gold/20">
                          ★ {selectedItem.rating}
                        </span>
                        <span className="text-slate-300 text-xs">{selectedItem.duration}</span>
                      </div>
                      <h2 className="text-2xl sm:text-3xl font-black text-white">{selectedItem.title}</h2>
                      <p className="text-slate-400 text-xs mt-1">{selectedItem.originalTitle}</p>
                    </div>
                  </div>
                </div>

                {/* Content Details */}
                <div className="p-6 sm:p-8">
                  <h4 className="text-sm font-bold text-slate-400 mb-2">قصة العرض:</h4>
                  <p className="text-slate-200 text-sm leading-relaxed mb-6">{selectedItem.story}</p>

                  <div className="mb-6 grid grid-cols-2 sm:grid-cols-3 gap-4 bg-slate-950/60 p-4 rounded-2xl border border-slate-800 text-xs">
                    <div>
                      <span className="text-slate-500 block">التصنيف:</span>
                      <span className="text-slate-200 font-semibold">{selectedItem.category}</span>
                    </div>
                    <div>
                      <span className="text-slate-500 block">سنة الإنتاج:</span>
                      <span className="text-slate-200 font-semibold">{selectedItem.year}</span>
                    </div>
                    <div>
                      <span className="text-slate-500 block">طاقم العمل:</span>
                      <span className="text-slate-200 font-semibold">{selectedItem.cast.join(', ')}</span>
                    </div>
                  </div>

                  {/* Links Section: Streaming & Direct Downloads */}
                  <div className="space-y-6">
                    {/* DIRECT STREAMING LINKS */}
                    <div>
                      <h4 className="text-sm font-bold text-white mb-3 flex items-center gap-2">
                        <i className="fa-solid fa-circle-play text-akwam-red"></i> روابط المشاهدة المباشرة (Akwam Direct Video Player):
                      </h4>
                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        {selectedItem.streamLinks.map((link, idx) => (
                          <button
                            key={idx}
                            onClick={() => {
                              setActivePlayerItem(selectedItem);
                              setActiveQuality(link.quality);
                              setSelectedItem(null);
                            }}
                            className="flex items-center justify-between bg-slate-800 hover:bg-slate-700 border border-slate-700 hover:border-akwam-red p-3 rounded-xl transition-all group"
                          >
                            <div className="text-right">
                              <div className="font-bold text-white text-sm group-hover:text-akwam-red transition-colors">جودة {link.quality}</div>
                              <div className="text-[10px] text-slate-400">{link.size} • تشغيل مباشر</div>
                            </div>
                            <i className="fa-solid fa-play text-slate-400 group-hover:text-akwam-red text-xs"></i>
                          </button>
                        ))}
                      </div>
                    </div>

                    {/* DOWNLOAD LINKS */}
                    <div>
                      <h4 className="text-sm font-bold text-white mb-3 flex items-center gap-2">
                        <i className="fa-solid fa-download text-akwam-accent"></i> روابط التحميل المباشرة:
                      </h4>
                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        {selectedItem.downloadLinks.map((link, idx) => (
                          <a
                            key={idx}
                            href={link.url}
                            target="_blank"
                            rel="noopener noreferrer"
                            className="flex items-center justify-between bg-slate-950 hover:bg-slate-800 border border-slate-800 p-3 rounded-xl transition-all group"
                          >
                            <div className="text-right">
                              <div className="font-bold text-slate-200 text-sm">{link.quality}</div>
                              <div className="text-[10px] text-slate-400">الحجم: {link.size}</div>
                            </div>
                            <i className="fa-solid fa-file-arrow-down text-slate-400 group-hover:text-akwam-accent"></i>
                          </a>
                        ))}
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* HTML5 DIRECT VIDEO PLAYER MODAL */}
          {activePlayerItem && (
            <div className="fixed inset-0 z-50 bg-black/95 flex flex-col justify-between animate-fadeIn">
              {/* Player Top Controls */}
              <div className="p-4 sm:p-6 flex items-center justify-between bg-gradient-to-b from-black/90 to-transparent">
                <div className="flex items-center gap-4">
                  <button 
                    onClick={() => setActivePlayerItem(null)}
                    className="w-10 h-10 bg-slate-800/80 hover:bg-slate-700 text-white rounded-full flex items-center justify-center transition-colors border border-slate-700"
                  >
                    <i className="fa-solid fa-arrow-right"></i>
                  </button>
                  <div>
                    <h3 className="font-bold text-white text-lg sm:text-xl">{activePlayerItem.title}</h3>
                    <p className="text-slate-400 text-xs">مشاهدة مباشرة من سيرفرات Akwam Direct</p>
                  </div>
                </div>

                {/* Quality Selector */}
                <div className="flex items-center gap-2 bg-slate-900 border border-slate-800 p-1 rounded-xl">
                  <span className="text-xs text-slate-400 px-2 font-semibold hidden sm:inline">الجودة:</span>
                  {activePlayerItem.streamLinks.map((s) => (
                    <button
                      key={s.quality}
                      onClick={() => setActiveQuality(s.quality)}
                      className={`px-3 py-1 rounded-lg text-xs font-bold transition-all ${activeQuality === s.quality ? 'bg-akwam-red text-white' : 'text-slate-400 hover:text-white'}`}
                    >
                      {s.quality}
                    </button>
                  ))}
                </div>
              </div>

              {/* Video Tag Integration */}
              <div className="flex-1 flex items-center justify-center p-2 sm:p-6">
                <div className="w-full max-w-5xl aspect-video bg-slate-950 rounded-2xl overflow-hidden shadow-2xl border border-slate-800 relative">
                  <video 
                    key={`${activePlayerItem.id}-${activeQuality}`}
                    controls 
                    autoPlay
                    className="w-full h-full object-contain"
                    poster={activePlayerItem.banner}
                  >
                    <source 
                      src={
                        activePlayerItem.streamLinks.find(s => s.quality === activeQuality)?.url || 
                        activePlayerItem.streamLinks[0]?.url
                      } 
                      type="video/mp4" 
                    />
                    متصفحك لا يدعم تشغيل هذا الفيديو المباشر.
                  </video>
                </div>
              </div>

              {/* Player Bottom Info */}
              <div className="p-4 sm:p-6 bg-slate-950 border-t border-slate-900 text-center text-xs text-slate-400">
                يتم التشغيل باستخدام HTML5 Direct Player وعبر الروابط المباشرة المسحوبة من مزود Akwam.
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="border-t border-slate-800/80 bg-slate-950 py-8 mt-12 text-center text-slate-500 text-sm">
            <div className="max-w-7xl mx-auto px-4">
              <p className="mb-2">جميع الحقوق محفوظة منصة أكوام السينمائية © 2026</p>
              <p className="text-xs text-slate-600">مصمم للعرض وتوفير بث الفيديوهات المباشرة بالجودات العالية (1080p, 720p, 480p)</p>
            </div>
          </footer>
        </div>
      );
    }

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
